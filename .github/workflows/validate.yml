name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS-Validierung
    # Fest auf Ubuntu 24.04: ubuntu-latest wechselt im Nov. 2026 auf 26.04;
    # die HACS-/hassfest-Actions sind dort noch nicht erprobt.
    runs-on: ubuntu-24.04
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: hassfest-Validierung
    # Fest auf Ubuntu 24.04: ubuntu-latest wechselt im Nov. 2026 auf 26.04;
    # die HACS-/hassfest-Actions sind dort noch nicht erprobt.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
